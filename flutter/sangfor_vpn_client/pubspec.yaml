name: sangfor_vpn_client
description: >-
  Dart/Flutter bindings for the zju-connect VPN core (Sangfor EasyConnect and
  aTrust). Provides both a packet data plane for platform tun devices and a
  userspace proxy data plane that works without root.
version: 0.1.0
repository: https://github.com/preca-hoshino/zju-connect
issue_tracker: https://github.com/preca-hoshino/zju-connect/issues

environment:
  sdk: ^3.13.2

dependencies:
  # Used only by hook/build.dart, to unpack a downloaded release archive. The
  # archive package is needed because pub.dev rejects packages over 100 MB,
  # while the Go library alone is roughly 27 MB per platform.
  archive: ^4.3.0
  code_assets: ^1.1.0
  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  # No native_toolchain_c: the shared library is produced by the Go toolchain
  # (see binding/build.sh) and only copied by hook/build.dart.

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
