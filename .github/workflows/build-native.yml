name: Build Native Library

# Builds the Go shared library consumed by flutter/sangfor_vpn_client.
#
# The Dart package cannot ship these artifacts inside the .pub archive: pub.dev
# rejects packages larger than 100 MB, and a single platform's library is around
# 27 MB. Instead every release carries one zip per target
# (zju-connect-<os>-<arch>.zip) and the package's build hook downloads the one
# it needs. See flutter/sangfor_vpn_client/hook/build.dart.

on:
  release:
    types: [published]
  push:
    paths:
      - "binding/**"
      - "client/**"
      - "configs/**"
      - "dial/**"
      - "internal/**"
      - "log/**"
      - "resolve/**"
      - "service/**"
      - "stack/**"
      - "underlay/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-native.yml"
  pull_request:
    paths:
      - "binding/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-native.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with the layout binding/build.sh writes and the Dart hook reads.
  OUT_DIR: ${{ github.workspace }}/artifacts

jobs:
  desktop:
    name: ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, key: linux-x64, file: libzju_connect.so }
          # Both macOS slices are built on the arm64 runner: clang on an arm64
          # host cross-compiles the x64 slice, whereas the Intel runner image is
          # slow to provision (builds were stuck queued for minutes).
          - { runner: macos-latest, key: macos-x64, file: libzju_connect.dylib, target_arch: amd64 }
          - { runner: macos-latest, key: macos-arm64, file: libzju_connect.dylib, target_arch: arm64 }
          - { runner: windows-latest, key: windows-x64, file: zju_connect.dll }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          TARGET_GOARCH: ${{ matrix.target_arch }}
        run: bash binding/build.sh host

      - name: Verify the library was produced
        shell: bash
        run: |
          test -f "$OUT_DIR/${{ matrix.key }}/${{ matrix.file }}" \
            || { echo "::error::${{ matrix.file }} missing for ${{ matrix.key }}"; exit 1; }
          ls -lh "$OUT_DIR/${{ matrix.key }}"

      - name: Package
        shell: bash
        run: |
          # `zip` is absent on the Windows runner, so pack with Python, which
          # every runner provides.
          python - <<'PY'
          import os, zipfile
          key = "${{ matrix.key }}"
          out = os.environ["OUT_DIR"]
          archive = os.path.join(out, f"zju-connect-{key}.zip")
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(os.listdir(os.path.join(out, key))):
                  path = os.path.join(out, key, name)
                  if os.path.isfile(path):
                      z.write(path, f"{key}/{name}")
          print(f"packaged {archive}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zju-connect-${{ matrix.key }}
          path: ${{ env.OUT_DIR }}/zju-connect-${{ matrix.key }}.zip
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all Android ABIs
        shell: bash
        run: |
          # The runner ships the Android SDK and NDK; build.sh finds the NDK
          # through ANDROID_NDK_HOME or $ANDROID_HOME/ndk.
          echo "NDK candidates:"
          ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null || true
          bash binding/build.sh android

      - name: Verify and package
        shell: bash
        run: |
          cd "$OUT_DIR"
          for abi in android-arm64 android-arm android-ia32; do
            test -f "$abi/libzju_connect.so" \
              || { echo "::error::libzju_connect.so missing for $abi"; exit 1; }
          done
          # `zip` is not installed on every runner; Python is.
          python - <<'PY'
          import os, zipfile
          out = os.environ["OUT_DIR"]
          for abi in ("android-arm64", "android-arm", "android-ia32"):
              archive = os.path.join(out, f"zju-connect-{abi}.zip")
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for name in sorted(os.listdir(os.path.join(out, abi))):
                      path = os.path.join(out, abi, name)
                      if os.path.isfile(path):
                          z.write(path, f"{abi}/{name}")
              print(f"packaged {archive}")
          PY
          ls -1 "$OUT_DIR"/zju-connect-android-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zju-connect-android
          path: ${{ env.OUT_DIR }}/zju-connect-android-*.zip
          if-no-files-found: error

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build iOS archives
        shell: bash
        run: bash binding/build.sh ios

      - name: Verify and package
        shell: bash
        run: |
          cd "$OUT_DIR"
          for arch in ios-arm64 ios-x64; do
            test -f "$arch/libzju_connect.a" \
              || { echo "::error::libzju_connect.a missing for $arch"; exit 1; }
          done
          # `zip` is not installed on every runner; Python is.
          python - <<'PY'
          import os, zipfile
          out = os.environ["OUT_DIR"]
          for arch in ("ios-arm64", "ios-x64"):
              archive = os.path.join(out, f"zju-connect-{arch}.zip")
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for name in sorted(os.listdir(os.path.join(out, arch))):
                      path = os.path.join(out, arch, name)
                      if os.path.isfile(path):
                          z.write(path, f"{arch}/{name}")
              print(f"packaged {archive}")
          PY
          ls -1 "$OUT_DIR"/zju-connect-ios-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zju-connect-ios
          path: ${{ env.OUT_DIR }}/zju-connect-ios-*.zip
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [desktop, android, ios]
    if: github.event_name == 'release' || (github.event_name == 'push' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES || '', github.ref_name))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload zips to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'release' && github.event.release.tag_name || 'nightly' }}"
          ls -lh dist/
          # This job downloads artifacts only and does not check out the
          # repository, so gh has no git context to infer the repo from.
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber "$tag" dist/zju-connect-*.zip

      - name: Summarise
        run: |
          {
            echo "### Native library artifacts"
            echo
            echo "| Target | Archive |"
            echo "| --- | --- |"
            for f in dist/zju-connect-*.zip; do
              echo "| $(basename "$f" .zip | sed 's/^zju-connect-//') | \`$(basename "$f")\` |"
            done
            echo
            echo "Consume these by setting \`download-url\` in the app's pubspec.yaml."
          } >> "$GITHUB_STEP_SUMMARY"
